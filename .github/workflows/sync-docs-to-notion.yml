name: Sync Markdown to Notion

on:
  push:
    branches:
      - main

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Sync Markdown to Notion
        run: npx @vrerv/md-to-notion -t "${{ secrets.NOTION_TOKEN }}" -p "${{ secrets.NOTION_PARENT_PAGE_ID }}" .
